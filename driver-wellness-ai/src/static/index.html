<!DOCTYPE html>
<html>
<head>
    <title>Driver Wellness AI Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Driver Wellness Monitor</h1>
        <div class="status-container">
            <div id="status">Status: Not Monitoring</div>
            <div id="alertStatus">No Alerts</div>
        </div>
        <div class="controls">
            <button id="startBtn">Start Monitoring</button>
            <button id="stopBtn">Stop Monitoring</button>
        </div>
        <div class="stats">
            <h2>Statistics</h2>
            <div id="drowsyEvents">Drowsy Events: 0</div>
            <div id="sessionTime">Session Time: 00:00:00</div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
